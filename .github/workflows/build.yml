name: Build Merlin APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "full = complete VS Code; slim = fewer built-in features (to compare speed and memory)"
        type: choice
        options: [full, slim]
        default: full
  push: { branches: [main] }
env:
  VSCODE_TAG: "1.145.2"
  VARIANT: ${{ inputs.variant || 'full' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached VS Code Web build
        id: web
        uses: actions/cache@v4
        with:
          path: vscode-web
          key: merlin-web-${{ env.VSCODE_TAG }}-${{ env.VARIANT }}-${{ hashFiles('scripts/brand.mjs', 'branding/**') }}
      - name: Add swap (the VS Code build is memory hungry)
        if: steps.web.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo fallocate -l 8G /mnt/vscode-swap
          sudo chmod 600 /mnt/vscode-swap
          sudo mkswap /mnt/vscode-swap
          sudo swapon /mnt/vscode-swap
      - name: Get Code - OSS source (MIT)
        if: steps.web.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$VSCODE_TAG" https://github.com/microsoft/vscode.git vscode
      - uses: actions/setup-node@v4
        if: steps.web.outputs.cache-hit != 'true'
        with: { node-version-file: vscode/.nvmrc }
      - name: Install system libraries
        if: steps.web.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev pkg-config
      - name: Brand as Merlin
        if: steps.web.outputs.cache-hit != 'true'
        run: node scripts/brand.mjs vscode branding "$VARIANT"
      - name: Install VS Code deps
        if: steps.web.outputs.cache-hit != 'true'
        working-directory: vscode
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1", PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1", GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: npm ci || (sleep 30 && npm ci)
      - name: Build VS Code Web
        if: steps.web.outputs.cache-hit != 'true'
        working-directory: vscode
        env: { NODE_OPTIONS: "--max-old-space-size=8192" }
        run: npm run gulp vscode-web-min
      - uses: actions/setup-node@v4
        if: steps.web.outputs.cache-hit == 'true'
        with: { node-version: "22" }
      - name: Fetch Pyodide (Python for the browser)
        run: |
          mkdir -p /tmp/pyo && cd /tmp/pyo && npm init -y >/dev/null && npm install pyodide@314.0.8 --silent
          mkdir -p "$GITHUB_WORKSPACE/vscode-web/pyodide"
          cd node_modules/pyodide
          cp pyodide.mjs pyodide.asm.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json "$GITHUB_WORKSPACE/vscode-web/pyodide/"
      - name: Fetch C/C++ loader (small; the 29 MB compiler pack downloads on demand)
        run: |
          mkdir -p /tmp/clangpkg && cd /tmp/clangpkg && npm init -y >/dev/null && npm install @live-codes/clang-wasm@0.3.0 --silent
          mkdir -p "$GITHUB_WORKSPACE/vscode-web/clang"
          cd node_modules/@live-codes/clang-wasm
          cp dist/clang-wasm.global.js LICENSE THIRD-PARTY-NOTICES.md "$GITHUB_WORKSPACE/vscode-web/clang/"
      - name: Generate index.html and pack
        run: |
          mkdir -p vscode/src/vs/code/browser/workbench
          T=vscode/src/vs/code/browser/workbench/workbench.html
          [ -f "$T" ] || curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/${VSCODE_TAG}/src/vs/code/browser/workbench/workbench.html" -o "$T"
          ls vscode-web | head -20
          node scripts/make-index.mjs vscode vscode-web
          mkdir -p app/src/main/assets
          (cd vscode-web && zip -qr -0 ../app/src/main/assets/merlin-web.zip .)
          ls -lh app/src/main/assets/merlin-web.zip
      - name: Pack sources (where the app downloads optional packs from)
        run: |
          mkdir -p app/src/main/assets
          echo "{\"pythonUrl\":\"https://github.com/${{ github.repository }}/releases/download/python-3.14.10/python-3.14.10-android-arm64.tar.gz\"}" > app/src/main/assets/packs.json
          cat app/src/main/assets/packs.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }} -PappSuffix=${{ env.VARIANT == 'slim' && '.slim' || '' }}
      - uses: actions/upload-artifact@v4
        with: { name: "merlin-${{ env.VARIANT }}-apk", path: app/build/outputs/apk/debug/app-debug.apk }
